  # ===========================================================================
  # 5) BÜYÜK İŞ PORTALLARI
  # ===========================================================================
  - slug: linkedin-tr
    name: LinkedIn
    enabled: true
    source_type: portal
    ats_type: portal
    adapter: portals.linkedin
    careers_url: https://www.linkedin.com/jobs
    full_sync: false
    config:
      site_name: linkedin
      location: Turkey
      turkey_only: true
      hours_old: 24
      delay_min_sec: 2.0
      delay_max_sec: 3.8
      max_429_retries: 2
      queries:
        - label: tum-sektorler
          keywords: ""
          max_jobs: 250
        - label: staj
          keywords: "staj"
          max_jobs: 120
        - label: intern
          keywords: "intern"
          max_jobs: 100

  - slug: youthall
    name: Youthall
    enabled: true
    source_type: portal
    ats_type: portal
    adapter: portals.youthall
    careers_url: https://www.youthall.com/tr/is-ilanlari/
    full_sync: true
    config:
      site_name: youthall
      max_pages: 10
      delay_min_sec: 1.0
      delay_max_sec: 2.0

  - slug: indeed-tr
    name: Indeed
    enabled: true
    source_type: portal
    ats_type: portal
    adapter: portals.jobspy_portal
    careers_url: https://tr.indeed.com
    full_sync: false
    config:
      site_name: indeed
      location: Turkey
      country_indeed: Turkey
      turkey_only: true
      hours_old: 24
      results_wanted: 100
      delay_min_sec: 2.5
      delay_max_sec: 4.5
      search_terms:
        - ""
        - "staj"
        - "intern"

  - slug: techcareer
    name: Techcareer.net
    enabled: true
    source_type: portal
    ats_type: portal
    adapter: portals.techcareer
    careers_url: https://www.techcareer.net/jobs
    full_sync: false
    config:
      site_name: techcareer
      max_pages: 1
      fetch_details: true
